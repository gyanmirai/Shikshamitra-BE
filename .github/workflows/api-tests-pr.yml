name: API Tests (PR Gate)

on:
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "*.md"

env:
  DOTNET_VERSION: "9.0.x"

jobs:
  critical-tests:
    name: Critical API Tests (Tier 0)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run Critical API Tests
        run: >
          dotnet test test/ShikshaMitra.HttpApi.Tests
          --configuration Release
          --no-build
          --filter "Tier=Critical"
          --logger "trx;LogFileName=critical-results.trx"
          --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critical-test-results
          path: ./test-results/*.trx

  important-tests:
    name: Important API Tests (Tier 1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: critical-tests

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run Important API Tests
        run: >
          dotnet test test/ShikshaMitra.HttpApi.Tests
          --configuration Release
          --no-build
          --filter "Tier=Important"
          --logger "trx;LogFileName=important-results.trx"
          --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: important-test-results
          path: ./test-results/*.trx

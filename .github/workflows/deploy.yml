name: Deploy ABP App using Publish Profile

on:
  push:
    branches: ["main"]

env:
  AZURE_WEBAPP_NAME: stg-gyanmirai-be
  DOTNET_VERSION: '9.0.x'
  ASPNETCORE_ENVIRONMENT: Staging
  DOTNET_ENVIRONMENT: Staging
  DOTNET_USELAUNCHSETTINGS: '0'
  SeedTestLogins: 'true'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore
      run: dotnet restore

    - name: Install ABP CLI
      run: dotnet tool install -g Volo.Abp.Cli

    - name: Download ABP libraries
      run: abp install-libs

    - name: Build
      run: dotnet build --configuration Release

    - name: Run HR deployment regression gates
      run: |
        dotnet test test/ShikshaMitra.EntityFrameworkCore.Tests \
          --configuration Release \
          --no-build \
          --filter "FullyQualifiedName~LegacyMigrationBaselineBridge_Tests"
        dotnet test test/ShikshaMitra.Domain.Tests \
          --configuration Release \
          --no-build \
          --filter "FullyQualifiedName~EmployeeApplication_Tests|FullyQualifiedName~PayrollLockPreconditionGuard_Tests|FullyQualifiedName~PolicyAggregateRequiredIds_Tests|FullyQualifiedName~RolesSeederContributor_Tests"
        dotnet test test/ShikshaMitra.Application.Tests \
          --configuration Release \
          --no-build \
          --filter "FullyQualifiedName~AttendanceRegisterAdjustmentMapper_Tests|FullyQualifiedName~EmployeeApplicationAppService_Tests|FullyQualifiedName~EmployeeDashboardProjection_Tests|FullyQualifiedName~EarningComponentAppService_Tests|FullyQualifiedName~HrPolicyAppService_Tests|FullyQualifiedName~PayrollRunItemPreview_Tests|FullyQualifiedName~PolicyReportRegression_Tests"
        dotnet test test/ShikshaMitra.HttpApi.Tests \
          --configuration Release \
          --no-build \
          --filter "FullyQualifiedName~EmployeeApplicationPublicApi_Tests|FullyQualifiedName~EmployeeListApi_Tests|FullyQualifiedName~EarningComponentApi_Tests|FullyQualifiedName~RunPayrollApi_Tests|FullyQualifiedName~HrEndpointContractSnapshotGuard_Tests"

    - name: Apply database migrations and seed updates
      env:
        ConnectionStrings__Default: ${{ secrets.DB_CONNECTION_STRING }}
      run: |
        cd src/ShikshaMitra.DbMigrator
        dotnet run --configuration Release --no-build --no-launch-profile

    # ⭐ Publish Host App
    - name: Publish
      run: dotnet publish src/ShikshaMitra.HttpApi.Host -c Release -o ./publish

    # ⭐ Deploy using Publish Profile
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./publish


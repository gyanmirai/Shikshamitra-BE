name: Deploy ABP App using Publish Profile

on:
    push:
        branches: ['main']

concurrency:
    group: deploy-backend-${{ github.ref }}
    cancel-in-progress: false

env:
    AZURE_WEBAPP_NAME: shikshamitra-dev
    DOTNET_VERSION: '9.0.x'
    ASPNETCORE_ENVIRONMENT: Staging
    DOTNET_ENVIRONMENT: Staging
    DOTNET_USELAUNCHSETTINGS: '0'
    SeedTestLogins: 'true'

jobs:
    build:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Verify selected .NET SDK
              run: |
                  sdk_version=$(dotnet --version)
                  echo "Selected .NET SDK: $sdk_version"
                  [[ "$sdk_version" == 9.0.* ]]

            - name: Restore
              run: dotnet restore

            - name: Install ABP CLI
              # Match the ABP 9.0.0 packages and .NET 9 SDK used by this solution.
              run: dotnet tool install -g Volo.Abp.Cli --version 9.0.0

            - name: Download ABP libraries
              run: abp install-libs

            - name: Build
              # Limit concurrent compiler memory use on the hosted runner.
              run: dotnet build --configuration Release --no-restore -m:1 -p:UseSharedCompilation=false

            - name: Run deployment startup regression gates
              run: |
                  dotnet test test/ShikshaMitra.HttpApi.Tests \
                    --configuration Release \
                    --no-build \
                    --filter "FullyQualifiedName~OpenIddictCertificateStore_Tests"

            - name: Package backend release
              run: |
                  dotnet publish src/ShikshaMitra.HttpApi.Host -c Release --no-build -o ./release/host
                  dotnet publish src/ShikshaMitra.DbMigrator -c Release --no-build -o ./release/migrator
                  tar -cf backend-release.tar -C ./release host migrator

            - name: Upload backend release
              uses: actions/upload-artifact@v4
              with:
                  name: backend-release
                  path: backend-release.tar
                  if-no-files-found: error
                  overwrite: true
                  retention-days: 7

    deploy:
        if: github.ref == 'refs/heads/main'
        needs: build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Diagnose an existing production startup failure
              shell: pwsh
              env:
                  AZURE_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
              run: |
                  ./scripts/deployment/Get-AzureStartupDiagnostics.ps1 `
                    -PublishProfile $env:AZURE_PUBLISH_PROFILE

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Download backend release
              uses: actions/download-artifact@v4
              with:
                  name: backend-release

            - name: Extract backend release
              run: |
                  mkdir -p ./release
                  tar -xf backend-release.tar -C ./release
                  test -f ./release/host/ShikshaMitra.HttpApi.Host.dll
                  test -f ./release/migrator/ShikshaMitra.DbMigrator.dll

            - name: Validate Azure publish profile
              shell: pwsh
              env:
                  AZURE_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
              run: |
                  if ([string]::IsNullOrWhiteSpace($env:AZURE_PUBLISH_PROFILE)) {
                    throw 'AZURE_WEBAPP_PUBLISH_PROFILE is empty or unavailable to this workflow.'
                  }

                  try {
                    [xml]$profile = $env:AZURE_PUBLISH_PROFILE
                  }
                  catch {
                    throw 'AZURE_WEBAPP_PUBLISH_PROFILE is not valid publish-profile XML. Download a fresh profile from the target App Service.'
                  }

                  $publishUrl = [string]$profile.publishData.publishProfile.publishUrl
                  if ([string]::IsNullOrWhiteSpace($publishUrl)) {
                    throw 'AZURE_WEBAPP_PUBLISH_PROFILE does not contain a publish URL.'
                  }

                  Write-Output "Publish profile XML is valid; deployment endpoint: $publishUrl"

            # ⭐ Run ABP DbMigrator
            - name: Run DbMigrator
              env:
                  ConnectionStrings__Default: ${{ secrets.DB_CONNECTION_STRING }}
                  ShikshaMitra__Seeders__Enabled: 'false'
              run: |
                  cd ./release/migrator
                  dotnet ShikshaMitra.DbMigrator.dll

            # ⭐ Deploy using Publish Profile
            - name: Deploy to Azure Web App
              id: deploy
              uses: azure/webapps-deploy@v3
              with:
                  app-name: ${{ env.AZURE_WEBAPP_NAME }}
                  publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
                  package: ./release/host
                  # Kudu's manifest-based copy leaves runtime files from older releases in place.
                  clean: false

            - name: Verify deployed backend files
              shell: pwsh
              env:
                  AZURE_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
              run: |
                  ./scripts/deployment/Test-DeployedBackendFiles.ps1 `
                    -ExpectedSiteName '${{ env.AZURE_WEBAPP_NAME }}' `
                    -PublishedDirectory './release/host'

            - name: Verify deployed API startup
              id: health
              shell: pwsh
              run: |
                  $healthUri = 'https://stage-api.gyanmirai.in/.well-known/openid-configuration'
                  $lastStatus = 'no response'

                  foreach ($attempt in 1..60) {
                    try {
                      $response = Invoke-WebRequest `
                        -Uri $healthUri `
                        -Method Get `
                        -TimeoutSec 20 `
                        -SkipHttpErrorCheck
                      $lastStatus = [string]$response.StatusCode

                      if ($response.StatusCode -eq 200) {
                        Write-Output "Staging API startup check passed on attempt $attempt."
                        exit 0
                      }
                    }
                    catch {
                      $lastStatus = $_.Exception.Message
                    }

                    Write-Output "Staging API is not ready (attempt $attempt/60; status: $lastStatus)."
                    Start-Sleep -Seconds 10
                  }

                  Write-Error "Staging API startup check failed after 60 attempts (last status: $lastStatus)."

            - name: Verify deployed Academic notification routes
              shell: pwsh
              run: |
                  ./scripts/deployment/Test-DeployedAcademicNotificationRoutes.ps1 `
                    -ApiBaseUri 'https://stage-api.gyanmirai.in'

            - name: Collect Azure startup diagnostics
              if: failure() && steps.deploy.outcome == 'success'
              shell: pwsh
              env:
                  AZURE_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
              run: |
                  ./scripts/deployment/Get-AzureStartupDiagnostics.ps1 `
                    -PublishProfile $env:AZURE_PUBLISH_PROFILE

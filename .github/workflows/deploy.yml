name: Deploy ABP App using Publish Profile

on:
  push:
    branches: ["main"]

env:
  AZURE_WEBAPP_NAME: stg-gyanmirai-be
  DOTNET_VERSION: '9.0.x'
  ASPNETCORE_ENVIRONMENT: Staging
  DOTNET_ENVIRONMENT: Staging
  DOTNET_USELAUNCHSETTINGS: '0'
  SeedTestLogins: 'true'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore
      run: dotnet restore

    - name: Install ABP CLI
      run: dotnet tool install -g Volo.Abp.Cli

    - name: Download ABP libraries
      run: abp install-libs

    - name: Build
      run: dotnet build --configuration Release

    - name: Run HR deployment regression gates
      run: |
        dotnet test test/ShikshaMitra.EntityFrameworkCore.Tests \
          --configuration Release \
          --no-build \
          --filter "FullyQualifiedName~LegacyMigrationBaselineBridge_Tests"
        dotnet test test/ShikshaMitra.Domain.Tests \
          --configuration Release \
          --no-build \
          --filter "FullyQualifiedName~EmployeeApplication_Tests|FullyQualifiedName~PayrollLockPreconditionGuard_Tests|FullyQualifiedName~PolicyAggregateRequiredIds_Tests|FullyQualifiedName~RolesSeederContributor_Tests"
        dotnet test test/ShikshaMitra.Application.Tests \
          --configuration Release \
          --no-build \
          --filter "FullyQualifiedName~AttendanceRegisterAdjustmentMapper_Tests|FullyQualifiedName~EmployeeApplicationAppService_Tests|FullyQualifiedName~EmployeeDashboardProjection_Tests|FullyQualifiedName~EarningComponentAppService_Tests|FullyQualifiedName~HrPolicyAppService_Tests|FullyQualifiedName~PayrollRunItemPreview_Tests|FullyQualifiedName~PolicyReportRegression_Tests"
        dotnet test test/ShikshaMitra.HttpApi.Tests \
          --configuration Release \
          --no-build \
          --filter "FullyQualifiedName~EmployeeApplicationPublicApi_Tests|FullyQualifiedName~EmployeeListApi_Tests|FullyQualifiedName~EarningComponentApi_Tests|FullyQualifiedName~RunPayrollApi_Tests|FullyQualifiedName~HrEndpointContractSnapshotGuard_Tests"

    - name: Apply database migrations and seed updates
      env:
        ConnectionStrings__Default: ${{ secrets.DB_CONNECTION_STRING }}
      run: |
        cd src/ShikshaMitra.DbMigrator
        dotnet run --configuration Release --no-build --no-launch-profile

    # ⭐ Publish Host App
    - name: Publish
      run: dotnet publish src/ShikshaMitra.HttpApi.Host -c Release -o ./publish

    # ⭐ Deploy using Publish Profile
    - name: Deploy to Azure Web App
      id: deploy
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./publish

    - name: Verify deployed API startup
      id: health
      shell: pwsh
      run: |
        $healthUri = 'https://stage-api.gyanmirai.in/.well-known/openid-configuration'
        $lastStatus = 'no response'

        foreach ($attempt in 1..24) {
          try {
            $response = Invoke-WebRequest `
              -Uri $healthUri `
              -Method Get `
              -TimeoutSec 20 `
              -SkipHttpErrorCheck
            $lastStatus = [string]$response.StatusCode

            if ($response.StatusCode -eq 200) {
              Write-Output "Production API startup check passed on attempt $attempt."
              exit 0
            }
          }
          catch {
            $lastStatus = $_.Exception.Message
          }

          Write-Output "Production API is not ready (attempt $attempt/24; status: $lastStatus)."
          Start-Sleep -Seconds 10
        }

        Write-Error "Production API startup check failed after 24 attempts (last status: $lastStatus)."

    - name: Collect Azure startup diagnostics
      if: failure() && steps.deploy.outcome == 'success'
      shell: pwsh
      env:
        AZURE_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
      run: |
        [xml]$publishData = $env:AZURE_PUBLISH_PROFILE
        $profile = @(
          $publishData.publishData.publishProfile |
            Where-Object { $_.publishMethod -eq 'MSDeploy' }
        )[0]

        if ($null -eq $profile) {
          Write-Warning 'No MSDeploy profile was available for startup diagnostics.'
          exit 0
        }

        $userName = [string]$profile.userName
        $password = [string]$profile.userPWD
        Write-Output "::add-mask::$userName"
        Write-Output "::add-mask::$password"

        $publishHost = ([string]$profile.publishUrl) -replace ':443$', ''
        $authorization = [Convert]::ToBase64String(
          [Text.Encoding]::ASCII.GetBytes("${userName}:${password}")
        )

        try {
          Invoke-WebRequest `
            -Uri "https://${publishHost}/api/dump" `
            -Headers @{ Authorization = "Basic $authorization" } `
            -OutFile startup-diagnostics.zip `
            -TimeoutSec 120
          Write-Output 'Azure startup diagnostics were captured for private artifact review.'
        }
        catch {
          Write-Warning "Azure startup diagnostics could not be captured: $($_.Exception.Message)"
        }

    - name: Upload Azure startup diagnostics
      if: failure() && steps.deploy.outcome == 'success' && hashFiles('startup-diagnostics.zip') != ''
      uses: actions/upload-artifact@v4
      with:
        name: backend-startup-diagnostics
        path: startup-diagnostics.zip
        retention-days: 3


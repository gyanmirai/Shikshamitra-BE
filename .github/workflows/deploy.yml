name: Deploy ABP App using Publish Profile

on:
  push:
    branches: ["main"]

env:
  AZURE_WEBAPP_NAME: stg-gyanmirai-be
  DOTNET_VERSION: '9.0.x'
  ASPNETCORE_ENVIRONMENT: Staging
  DOTNET_ENVIRONMENT: Staging
  DOTNET_USELAUNCHSETTINGS: '0'
  SeedTestLogins: 'true'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Diagnose an existing production startup failure
      shell: pwsh
      env:
        AZURE_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
      run: |
        ./scripts/deployment/Get-AzureStartupDiagnostics.ps1 `
          -PublishProfile $env:AZURE_PUBLISH_PROFILE
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore
      run: dotnet restore

    - name: Install ABP CLI
      run: dotnet tool install -g Volo.Abp.Cli

    - name: Download ABP libraries
      run: abp install-libs

    - name: Build
      run: dotnet build --configuration Release

    - name: Run deployment startup regression gates
      run: |
        dotnet test test/ShikshaMitra.HttpApi.Tests \
          --configuration Release \
          --no-build \
          --filter "FullyQualifiedName~OpenIddictCertificateStore_Tests"

    # ⭐ Publish Host App
    - name: Publish
      shell: pwsh
      run: |
        dotnet publish src/ShikshaMitra.HttpApi.Host -c Release -o ./publish
        dotnet publish src/ShikshaMitra.DbMigrator -c Release -o ./publish/App_Data/jobs/triggered/DbMigrator
        @'
        @echo off
        set ASPNETCORE_ENVIRONMENT=Staging
        set DOTNET_ENVIRONMENT=Staging
        set DOTNET_USELAUNCHSETTINGS=0
        set ConnectionStrings__Default=
        set SeedTestLogins=true
        dotnet ShikshaMitra.DbMigrator.dll
        '@ | Set-Content -Path ./publish/App_Data/jobs/triggered/DbMigrator/run.cmd -Encoding ascii

    # ⭐ Deploy using Publish Profile
    - name: Deploy to Azure Web App
      id: deploy
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./publish

    - name: Apply database migrations and seed updates
      shell: pwsh
      env:
        AZURE_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
      run: |
        [xml]$publishData = $env:AZURE_PUBLISH_PROFILE
        $profile = @(
          $publishData.publishData.publishProfile |
            Where-Object { $_.publishMethod -eq 'MSDeploy' }
        )[0]

        if ($null -eq $profile) {
          throw 'No MSDeploy profile was available to run the DbMigrator WebJob.'
        }

        $userName = [string]$profile.userName
        $password = [string]$profile.userPWD
        Write-Output "::add-mask::$userName"
        Write-Output "::add-mask::$password"

        $publishHost = ([string]$profile.publishUrl) -replace ':443$', ''
        $authorization = [Convert]::ToBase64String(
          [Text.Encoding]::ASCII.GetBytes("${userName}:${password}")
        )
        $headers = @{ Authorization = "Basic $authorization" }
        $jobName = 'DbMigrator'

        Invoke-RestMethod `
          -Uri "https://${publishHost}/api/triggeredwebjobs/${jobName}/run" `
          -Method Post `
          -Headers $headers `
          -TimeoutSec 120 | Out-Null

        $lastStatus = 'not started'
        foreach ($attempt in 1..90) {
          Start-Sleep -Seconds 10
          $history = Invoke-RestMethod `
            -Uri "https://${publishHost}/api/triggeredwebjobs/${jobName}/history/latest" `
            -Method Get `
            -Headers $headers `
            -TimeoutSec 120
          $lastStatus = [string]$history.status
          Write-Output "DbMigrator WebJob status (attempt $attempt/90): $lastStatus"

          if ($lastStatus -eq 'Success') {
            exit 0
          }

          if ($lastStatus -in @('Failed', 'Error', 'Aborted')) {
            throw "DbMigrator WebJob failed with status: $lastStatus"
          }
        }

        throw "DbMigrator WebJob did not complete after 15 minutes (last status: $lastStatus)."

    - name: Verify deployed API startup
      id: health
      shell: pwsh
      run: |
        $healthUri = 'https://stage-api.gyanmirai.in/.well-known/openid-configuration'
        $lastStatus = 'no response'

        foreach ($attempt in 1..24) {
          try {
            $response = Invoke-WebRequest `
              -Uri $healthUri `
              -Method Get `
              -TimeoutSec 20 `
              -SkipHttpErrorCheck
            $lastStatus = [string]$response.StatusCode

            if ($response.StatusCode -eq 200) {
              Write-Output "Staging API startup check passed on attempt $attempt."
              exit 0
            }
          }
          catch {
            $lastStatus = $_.Exception.Message
          }

          Write-Output "Staging API is not ready (attempt $attempt/24; status: $lastStatus)."
          Start-Sleep -Seconds 10
        }

        Write-Error "Staging API startup check failed after 24 attempts (last status: $lastStatus)."

    - name: Collect Azure startup diagnostics
      if: failure() && steps.deploy.outcome == 'success'
      shell: pwsh
      env:
        AZURE_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
      run: |
        ./scripts/deployment/Get-AzureStartupDiagnostics.ps1 `
          -PublishProfile $env:AZURE_PUBLISH_PROFILE

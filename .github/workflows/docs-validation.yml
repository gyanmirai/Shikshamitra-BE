name: Documentation Validation

on:
  workflow_call:

jobs:
  backend-docs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Validate docs
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/docs/validate-docs.ps1 -AllModules
